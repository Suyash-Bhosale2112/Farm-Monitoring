name: Daily Farm Monitor

on:
  schedule:
    - cron: '0 6 * * *'     # 06:00 UTC daily = 11:30 IST
  workflow_dispatch:          # Manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: daily-farm-monitor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUD_SCORE_THRESHOLD: ${{ vars.CLOUD_SCORE_THRESHOLD || '0.60' }}
        run: python pipeline.py

      - name: Persist database and reports
        if: always() && hashFiles('data/farm_monitoring.db') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/farm_monitoring.db
          if [ -d data/reports ]; then git add data/reports; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update farm monitoring results" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
